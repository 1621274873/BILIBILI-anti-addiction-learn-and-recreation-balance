name: Bug report
description: Report a reproducible issue in Bili Balance.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include cookies, account identifiers, private browsing data, or unredacted watch history."
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: "For example, 130.0.0.0"
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: Extension version
      placeholder: "For example, 0.3.1"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the page type and actions. Avoid sharing private account or watch-history details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
